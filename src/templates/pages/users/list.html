<div x-data="userListComponent()" x-init="init()" class="users-page">
  <div class="page-header">
    <h2 class="page-title">用户列表</h2>
    <button class="btn btn-ghost btn-sm" @click="refresh()">刷新</button>
  </div>

  <div id="table-container">
    <!-- 错误提示 -->
    <template x-if="error">
      <div class="card state-box">
        <p class="text-danger" x-text="error"></p>
      </div>
    </template>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>姓名/昵称</th>
            <th>角色</th>
            <th>邮箱</th>
            <th>手机号</th>
            <th>状态</th>
            <th>创建时间</th>
          </tr>
        </thead>
        <tbody>
          <template x-if="loading">
            <tr>
              <td colspan="8" class="table-loading">加载中…</td>
            </tr>
          </template>

          <template x-if="!loading && !error && data.length === 0">
            <tr>
              <td colspan="8" class="table-empty">暂无用户数据</td>
            </tr>
          </template>

          <template x-if="!loading && !error && data.length > 0">
            <template x-for="(row, idx) in data" :key="idx">
              <tr>
                <td x-text="row.id"></td>
                <td x-text="row.username"></td>
                <td x-text="row.displayName"></td>
                <td><span class="badge badge-blue" x-text="getRoleLabel(row.role)"></span></td>
                <td x-text="row.email"></td>
                <td x-text="row.phone"></td>
                <td>
                  <span class="badge" :class="row.status === 1 ? 'badge-green' : 'badge-gray'" x-text="getStatusLabel(row.status)"></span>
                </td>
                <td x-text="row.createdAt?.slice(0, 10)"></td>
              </tr>
            </template>
          </template>
        </tbody>
      </table>

      <div class="pagination">
        <span x-text="'共 ' + total + ' 条，第 ' + page + '/' + totalPages + ' 页'"></span>
        <div class="pagination-btns">
          <button
            class="btn btn-ghost btn-sm"
            @click="goToPage(page - 1)"
            :disabled="page <= 1"
          >上一页</button>
          <button
            class="btn btn-ghost btn-sm"
            @click="goToPage(page + 1)"
            :disabled="page >= totalPages"
          >下一页</button>
        </div>
      </div>
    </div>
  </div>
</div>
