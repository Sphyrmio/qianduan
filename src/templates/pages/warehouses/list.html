<div x-data="warehouseListComponent()" x-init="init()" class="warehouses-page">
  <div class="page-header">
    <h2 class="page-title">🏭 仓库管理</h2>
    <div class="page-actions">
      <button class="btn btn-ghost btn-sm" @click="refresh()">🔄 刷新</button>
    </div>
  </div>

  <div class="card search-box warehouses-page__search-box">
    <div class="search-form">
      <input
        type="text"
        x-model="filters.code"
        @keyup.enter="search()"
        class="form-input warehouses-page__search-input"
        placeholder="仓库编码/名称"
      >
      <select x-model="filters.type" class="form-input warehouses-page__search-type">
        <option value="">全部类型</option>
        <option value="RAW_MATERIAL">原料仓</option>
        <option value="FINISHED_GOODS">成品仓</option>
        <option value="TRANSFER">中转仓</option>
      </select>
      <select x-model="filters.status" class="form-input warehouses-page__search-status">
        <option value="">全部状态</option>
        <option value="ENABLED">启用</option>
        <option value="DISABLED">停用</option>
      </select>
      <button class="btn btn-primary btn-sm" @click="search()">🔍 搜索</button>
      <button class="btn btn-ghost btn-sm" @click="reset()">重置</button>
    </div>
  </div>

  <div id="table-container">
    <!-- 错误提示 -->
    <template x-if="error">
      <div class="card state-box">
        <p class="warehouses-page__error" x-text="error"></p>
      </div>
    </template>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:60px">Id</th>
            <th style="width:100px">仓库编码</th>
            <th>仓库名称</th>
            <th style="width:100px">类型</th>
            <th style="width:150px">地址</th>
            <th style="width:80px">负责人</th>
            <th style="width:100px">电话</th>
            <th style="width:70px">状态</th>
            <th style="width:90px">操作</th>
          </tr>
        </thead>
        <tbody>
          <template x-if="loading">
            <tr>
              <td colspan="9" class="table-loading">加载中…</td>
            </tr>
          </template>

          <template x-if="!loading && !error && data.length === 0">
            <tr>
              <td colspan="9" class="table-empty">暂无仓库数据</td>
            </tr>
          </template>

          <template x-if="!loading && !error && data.length > 0">
            <template x-for="(row, idx) in data" :key="idx">
              <tr>
                <td x-text="row.id"></td>
                <td x-text="row.code"></td>
                <td x-text="row.name"></td>
                <td><span class="badge badge-blue" x-text="getTypeLabel(row.type)"></span></td>
                <td x-text="row.address"></td>
                <td x-text="row.manager"></td>
                <td x-text="row.phone"></td>
                <td>
                  <span class="badge" :class="getStatusClass(row.status)" x-text="getStatusLabel(row.status)"></span>
                </td>
                <td>
                  <button class="link-btn link-btn-primary" @click="showTree(row)">库区库位</button>
                </td>
              </tr>
            </template>
          </template>
        </tbody>
      </table>

      <div class="pagination">
        <span x-text="'共 ' + total + ' 条，第 ' + page + '/' + totalPages + ' 页'"></span>
        <div class="pagination-btns">
          <button
            class="btn btn-ghost btn-sm"
            @click="goToPage(page - 1)"
            :disabled="page <= 1"
          >上一页</button>
          <button
            class="btn btn-ghost btn-sm"
            @click="goToPage(page + 1)"
            :disabled="page >= totalPages"
          >下一页</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 库区库位：入库、出库的行里填的库位编码从这里查 -->
  <template x-if="treeError">
    <div class="card state-box">
      <p class="warehouses-page__error" x-text="treeError"></p>
    </div>
  </template>
  <template x-if="tree">
    <div class="card warehouses-page__tree">
      <div class="page-header">
        <h3 class="page-title" x-text="tree.warehouse.code + ' ' + tree.warehouse.name + ' 的库区和库位'"></h3>
        <button class="btn btn-ghost btn-sm" @click="tree = null">收起</button>
      </div>
      <template x-for="z in tree.zones" :key="z.zone.id">
        <div class="warehouses-page__zone">
          <p>
            <strong x-text="z.zone.code + ' ' + z.zone.name"></strong>
            <span class="text-muted text-sm" x-text="'库区主键 ' + z.zone.id"></span>
          </p>
          <div class="warehouses-page__locations">
            <template x-for="loc in z.locations" :key="loc.id">
              <span class="badge badge-blue" x-text="loc.code + '（主键 ' + loc.id + '）'"></span>
            </template>
            <span class="text-muted text-sm" x-show="z.locations.length === 0">这个库区还没有库位</span>
          </div>
        </div>
      </template>
    </div>
  </template>
</div>
